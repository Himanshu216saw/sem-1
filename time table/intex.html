<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Navbar</title>

<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:#131921;
    color:white;
}

/* Logo */
.logo{
    font-size:24px;
    font-weight:bold;
    color:#f08804;
}

/* Menu */
.nav-links{
    display:flex;
    list-style:none;
    gap:20px;
}

.nav-links li a{
    text-decoration:none;
    color:white;
    font-size:16px;
    transition:0.3s;
}

.nav-links li a:hover{
    color:#f08804;
}

/* Search Bar */
.search-box{
    display:flex;
    flex:1;
    margin:0 30px;
}

.search-box input{
    width:100%;
    padding:8px;
    border:none;
    outline:none;
}

.search-box button{
    padding:8px 15px;
    border:none;
    background:#febd69;
    cursor:pointer;
}

/* Cart */
.cart{
    font-size:18px;
}

/* Hamburger */
.menu-toggle{
    display:none;
    font-size:24px;
    cursor:pointer;
}

/* Responsive */
@media(max-width:768px){
    .search-box{
        display:none;
    }

    .nav-links{
        position:absolute;
        top:70px;
        left:0;
        width:100%;
        background:#232f3e;
        flex-direction:column;
        align-items:center;
        display:none;
        padding:20px 0;
    }

    .nav-links.active{
        display:flex;
    }

    .menu-toggle{
        display:block;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">ShopKart</div>

    <div class="search-box">
        <input type="text" placeholder="Search products...">
        <button>Search</button>
    </div>

    <ul class="nav-links" id="navLinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Deals</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="cart">🛒</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
</nav>

<script>
function toggleMenu(){
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
