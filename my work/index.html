<!DOCTYPE html>
<html>
<head>
<title>Experiment 6</title>
<style>
body{
    font-family: Arial;
    margin:0;
    background:#f2f2f2;
    text-align:center;
}
header{
    background:black;
    color:white; 
    padding:15px;
}
.product-card{
    width:300px;
    margin:40px auto;
    padding:20px;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px gray;
}
.product-card img{
    width:80%;
}
.price{
    color:green;
    font-size:18px;
}
.price span{
    text-decoration:line-through;
    color:gray;
    font-size:14px;
}
button{
    background:blue;
    color:white;
    border:none;
    padding:10px;
    width:100%;
}
</style>
</head>
<body>

<header><h1>ShopEasy</h1></header>

<div class="product-card">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="T-Shirt">

    <h2>Classic Cotton T-Shirt</h2>
    <p>Soft, breathable cotton. Available in multiple colors.</p>
    <p class="price">₹799 <span>₹1199</span></p>
    <button>Add to Cart</button>
</div>

</body>
</html>
